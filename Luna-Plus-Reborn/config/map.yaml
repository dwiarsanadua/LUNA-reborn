# LUNA Plus — MapServer Configuration
server:
  name: "LunaPlus MapServer 01"
  type: map
  port: 10002
  max_connections: 500
  worker_threads: 4
  bind_address: "0.0.0.0"

database:
  type: sqlite
  sqlite:
    member_db: "data/luna_member.db"
    game_db: "data/luna_game.db"
    log_db: "data/luna_log.db"

logging:
  level: debug
  file: "logs/map.log"
  console: true

network:
  tcp_nodelay: true
  send_buffer_size: 65536
  recv_buffer_size: 65536
